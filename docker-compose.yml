version: "3.9"

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: http://backend:8000
    container_name: coloquium_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - coloquium_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: coloquium_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - FLASK_ENV=production
    restart: unless-stopped
    networks:
      - coloquium_net

networks:
  coloquium_net:
    driver: bridge
